    <script>

        function formatDate(date) {
            const options = { day: "2-digit", month: "short", year: "numeric" };
            return date.toLocaleDateString("en-GB", options).replace(/ /g, "-");
        }

        const today = new Date();
        document.getElementById("date-display").textContent = formatDate(today);

        let totalPoints = 0;
        let totalPrice = 0;
        let totalGas = 0;
        let epPoints = 0;
        let epGas = 0;
        let fixedPoints = 0;
        let fixedGas = 0;
        let terminalTotalPoints = 0;
        let inputVal = 0;



        function toggleAccordion(button) {
            button.classList.toggle("active");
            const content = button.nextElementSibling;
            content.style.display = content.style.display === "flex" ? "none" : "flex";
        }

        let vfCashLocked = false; // new flag

        function updateValues(button, points, price, gas) {
            // === Prevent clicking VF-Cash when locked ===
            if (vfCashLocked && button.id === "vfCashBtn") {
                return; // ignore clicks until unlocked
            }

            // update totals
            totalPoints += points;
            totalPrice += price;
            totalGas += gas;
            document.getElementById("points").textContent = totalPoints;
            document.getElementById("price").textContent = totalPrice;
            document.getElementById("gas").textContent = totalGas;

            // increment click counter
            button.classList.add("clicked");
            const countSpan = button.querySelector(".click-count");
            let currentCount = parseInt(countSpan.textContent) || 0;
            countSpan.textContent = currentCount + 1;

            // === VF-Cash vs Flex logic ===
            const vfCashButton = document.getElementById("vfCashBtn");

            // get all Flex buttons
            const flexButtons = Array.from(document.querySelectorAll(".accordion-content button"))
                .filter(b => b.innerText.startsWith("Flex"));

            // total Flex clicks
            const totalFlexClicks = flexButtons.reduce((sum, b) => {
                const span = b.querySelector(".click-count");
                return sum + (span ? parseInt(span.textContent) || 0 : 0);
            }, 0);

            // VF-Cash clicks
            const vfSpan = vfCashButton.querySelector(".click-count");
            const vfCashClicks = vfSpan ? parseInt(vfSpan.textContent) || 0 : 0;

            // Apply styles and lock/unlock logic
            if (vfCashClicks === totalFlexClicks && totalFlexClicks > 0) {
                vfCashButton.style.backgroundColor = "red";
                vfCashButton.style.color = "white";
                vfCashLocked = true; // lock
            } else {
                vfCashButton.style.backgroundColor = "lightyellow";
                vfCashButton.style.color = "black";
                vfCashLocked = false; // unlock if Flex increases
            }
        }
        function updateEp(button, epPts, epG) {
            epPoints += epPts;
            epGas += epG;
            document.getElementById("epPoints").textContent = epPoints;
            document.getElementById("epGas").textContent = epGas;

            button.classList.add("clicked");
            const countSpan = button.querySelector(".click-count");
            let currentCount = parseInt(countSpan.textContent) || 0;
            countSpan.textContent = currentCount + 1;
        }

        function updateFixed(button, points, dslGas) {
            fixedPoints += points;
            fixedGas += dslGas;
            document.getElementById("fixedPoints").textContent = fixedPoints;
            document.getElementById("fixedGas").textContent = fixedGas;

            button.classList.add("clicked");
            const countSpan = button.querySelector(".click-count");
            let currentCount = parseInt(countSpan.textContent) || 0;
            countSpan.textContent = currentCount + 1;
        }

        function addConnectivityPoints(input) {
            const val = parseFloat(input.value);
            if (!isNaN(val)) {
                const addedPoints = Math.floor(val / 100);
                fixedPoints += addedPoints;
                document.getElementById("fixedPoints").textContent = fixedPoints;
            }
        }

        function calculateTerminalPoints() {
            const priceInput = document.getElementById("ter-Price");
            const pointsOutput = document.getElementById("ter-Point");
            const price = parseFloat(priceInput.value);

            if (isNaN(price)) {
                pointsOutput.value = "";
                return;
            }

            const baseValue = price / 1.14;
            let points = 0;
            const selectedType = document.querySelector('input[name="terminalType"]:checked');

            if (!selectedType) {
                points = Math.floor(baseValue / 100);
            } else {
                switch (selectedType.value) {
                    case "basic":
                        points = Math.floor((baseValue / 100) * 4);
                        break;
                    case "feature":
                        points = Math.floor((baseValue / 100) * 2);
                        break;
                    case "essential":
                        points = Math.floor(baseValue);
                        break;
                }
            }

            pointsOutput.value = points;
        }

        function addTerminalItem() {
            const pointsInput = document.getElementById("ter-Point");
            const points = parseFloat(pointsInput.value);

            if (!isNaN(points) && points > 0) {
                terminalTotalPoints += points;
                document.getElementById("ter-sumAll").value = terminalTotalPoints;
                totalPoints += points;
                // document.getElementById("points").textContent = totalPoints;

                // Reset the form
                document.getElementById("ter-Price").value = "";
                document.getElementById("ter-Point").value = "";
                const radios = document.querySelectorAll('input[name="terminalType"]');
                radios.forEach(radio => radio.checked = false);
            }
        }

        function resetValues() {
            totalPoints = 0;
            totalPrice = 0;
            totalGas = 0;
            epPoints = 0;
            epGas = 0;
            fixedPoints = 0;
            fixedGas = 0;
            terminalTotalPoints = 0;
            inputVal = 0;

            document.getElementById("points").textContent = totalPoints;
            document.getElementById("price").textContent = totalPrice;
            document.getElementById("gas").textContent = totalGas;
            document.getElementById("epPoints").textContent = epPoints;
            document.getElementById("epGas").textContent = epGas;
            document.getElementById("fixedPoints").textContent = fixedPoints;
            document.getElementById("fixedGas").textContent = fixedGas;
            document.getElementById("connectivity").value = inputVal;

            // Reset Terminal section
            document.getElementById("ter-Price").value = "";
            document.getElementById("ter-Point").value = "";
            document.getElementById("ter-sumAll").value = "";
            const terminalRadios = document.querySelectorAll('input[name="terminalType"]');
            terminalRadios.forEach(radio => radio.checked = true);

            // Reset all clicked buttons and counters
            const clickedButtons = document.querySelectorAll(".accordion-content button.clicked");
            clickedButtons.forEach(btn => {
                if (btn.classList) btn.classList.remove("clicked");
                const parent = btn.closest('button');
                if (parent) {
                    const countSpan = parent.querySelector(".click-count");
                    if (countSpan) countSpan.textContent = "0";
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const connectivityInput = document.getElementById("connectivity");
            const fixedPointsSpan = document.getElementById("fixedPoints");

            connectivityInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    const val = parseFloat(this.value);
                    if (!isNaN(val)) {
                        const addedPoints = Math.floor(val / 100);
                        fixedPoints += addedPoints;
                        fixedPointsSpan.textContent = fixedPoints;

                        fixedPointsSpan.classList.add("highlight");
                        setTimeout(() => fixedPointsSpan.classList.remove("highlight"), 500);
                    }
                    this.value = "";
                }
            });
        });
    </script>
