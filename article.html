<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VF Guide Knowledge Center</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--primary:#e60000;
--dark:#111827;
--gray:#6b7280;
--light:#f9fafb;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

header{
background:linear-gradient(135deg,#e60000,#b30000);
padding:30px;
color:white;
text-align:center;
box-shadow:0 4px 20px rgba(0,0,0,.15);
}

header h1{
font-size:2rem;
}

header p{
margin-top:10px;
opacity:.9;
}

.controls{
max-width:1200px;
margin:auto;
padding:25px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

#search{
flex:1;
min-width:250px;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

#categoryFilter{
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
cursor:pointer;
transition:.3s;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-category{
display:inline-block;
background:#ffe5e5;
color:#e60000;
padding:5px 12px;
border-radius:20px;
font-size:13px;
margin-bottom:10px;
}

.card h2{
font-size:22px;
margin-bottom:10px;
}

.meta{
color:#777;
font-size:14px;
margin-bottom:10px;
}

.summary{
color:#555;
line-height:1.8;
}

.viewer{
display:none;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.viewer img{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:15px;
margin-bottom:20px;
}

.viewer h1{
margin-bottom:15px;
}

.viewer .content{
margin-top:25px;
line-height:2;
font-size:18px;
}

.back-btn{
background:var(--primary);
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-bottom:25px;
}

@media(max-width:768px){

header h1{
font-size:1.5rem;
}

.viewer{
padding:20px;
}

.card h2{
font-size:18px;
}

}

</style>

</head>

<body>

<header>

<h1>VF Guide Knowledge Center</h1>

<p>
مركز المعرفة والتطوير لموظفي المبيعات وخدمة العملاء
</p>

</header>

<div class="controls">

<input
type="text"
id="search"
placeholder="ابحث عن مقال..."
>

<select id="categoryFilter">

<option value="">كل التصنيفات</option>

</select>

</div>

<div class="container">

<div id="articlesGrid" class="grid"></div>

<div id="articleViewer" class="viewer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let articles=[];

const grid=document.getElementById('articlesGrid');
const viewer=document.getElementById('articleViewer');
const search=document.getElementById('search');
const filter=document.getElementById('categoryFilter');

fetch('articles.csv')
.then(response=>response.text())
.then(csv=>{

const data=Papa.parse(csv,{
header:true,
skipEmptyLines:true
});

articles=data.data;

renderCategories();

renderArticles(articles);

loadArticleFromUrl();

});

function renderCategories(){

const categories=[
...new Set(
articles.map(a=>a.category)
)
];

categories.forEach(category=>{

filter.innerHTML+=`
<option value="${category}">
${category}
</option>
`;

});

}

function renderArticles(data){

grid.innerHTML='';

data.forEach(article=>{

grid.innerHTML+=`

<div
class="card"
onclick="openArticle(${article.id})"
>

<img src="${article.image}" alt="">

<div class="card-content">

<span class="card-category">
${article.category}
</span>

<h2>
${article.title}
</h2>

<div class="meta">

${article.author}
•
${article.date}
•
${article.readingTime}

</div>

<div class="summary">

${article.summary}

</div>

</div>

</div>

`;

});

}

function openArticle(id){

const article=
articles.find(
a=>a.id==id
);

if(!article) return;

grid.style.display='none';

viewer.style.display='block';

viewer.innerHTML=`

<button
class="back-btn"
onclick="closeArticle()"
>
العودة للمقالات
</button>

<img src="${article.image}">

<h1>
${article.title}
</h1>

<div class="meta">

${article.author}
•
${article.date}
•
${article.readingTime}

</div>

<div class="content">

${article.content}

</div>

`;

document.title=article.title;

history.pushState(
{},
'',
'?article='+id
);

window.scrollTo({
top:0,
behavior:'smooth'
});

}

function closeArticle(){

viewer.style.display='none';

grid.style.display='grid';

history.pushState(
{},
'',
window.location.pathname
);

document.title=
'VF Guide Knowledge Center';

}

function loadArticleFromUrl(){

const params=
new URLSearchParams(
window.location.search
);

const id=
params.get('article');

if(id){

openArticle(id);

}

}

search.addEventListener(
'input',
filterArticles
);

filter.addEventListener(
'change',
filterArticles
);

function filterArticles(){

const keyword=
search.value.toLowerCase();

const category=
filter.value;

const result=
articles.filter(article=>{

const matchesText=

article.title
.toLowerCase()
.includes(keyword)

||

article.summary
.toLowerCase()
.includes(keyword);

const matchesCategory=

!category
||
article.category===category;

return matchesText
&&
matchesCategory;

});

renderArticles(result);

}

</script>

</body>

</html>
